[package]
name = "matrixnet"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    ".."
]

[dependencies]
# Windowing
winit = "0.29"

# Async
tokio = { version = "1", features = ["full"] }

# Crypto
aes-gcm = "0.10"
rand = "0.8"
rand_core = "0.6"
x25519-dalek = "2"

# Compression
zstd = "0.13"

# Image loading
image = "0.24"

# Low-level
libc = "0.2"
